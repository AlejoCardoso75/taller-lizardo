<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de producto - Taller Lizardo Car</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="sitio-header">
    <h1>Taller Lizardo Car</h1>
    <p>Módulo de Inventario (Spring Boot)</p>
</header>

<main class="contenido">
    <div class="card">
        <!-- th:text decide el título según si el producto ya tiene id o no -->
        <h2 th:text="${producto.id != null} ? 'Editar producto' : 'Nuevo producto'"></h2>

        <!--
          th:object vincula este formulario al objeto "producto" del modelo;
          th:field asocia cada input directamente a un atributo de esa clase,
          precargando su valor automáticamente si ya existe.
        -->
        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoría</label>
                <input type="text" id="categoria" th:field="*{categoria}" required>
            </div>

            <div class="campo">
                <label for="marca">Marca</label>
                <input type="text" id="marca" th:field="*{marca}" required>
            </div>

            <div class="campo">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" th:field="*{cantidad}" min="0" required>
            </div>

            <div class="campo">
                <label for="precio">Precio</label>
                <input type="number" id="precio" th:field="*{precio}" min="0" step="0.01" required>
            </div>

            <div class="barra-acciones">
                <a class="btn btn-outline" th:href="@{/productos}">Cancelar</a>
                <button type="submit" class="btn btn-primario">Guardar</button>
            </div>
        </form>
    </div>
</main>

<footer class="sitio-footer">
    <p>Taller Lizardo Car &middot; GA7-220501096-AA3-EV01</p>
</footer>

</body>
</html>
