server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/taller_lizardo_car?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA: "update" hace que, si la tabla productos ya existe (creada
# con database/script-base-datos.sql), Hibernate la reutilice y solo
# ajuste columnas si hicieran falta, sin borrar los datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita que Thymeleaf guarde las plantillas en caché mientras se desarrolla
spring.thymeleaf.cache=false
